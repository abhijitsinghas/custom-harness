name: thelittlelibrary
description: The Little Library v2 — Home library cataloging app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Database
  drift:
  drift_flutter:
  sqlite3_flutter_libs:

  # Routing
  go_router: ^17.2.0

  # ML Kit
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_barcode_scanning: ^0.14.0

  # Google APIs
  googleapis: ^16.0.0
  google_sign_in: ^7.2.0
  google_generative_ai: ^0.4.7

  # Media
  image_picker: ^1.2.0

  # Storage
  path_provider: ^2.1.0
  path: ^1.9.0
  shared_preferences: ^2.3.0

  # Sharing
  share_plus: ^13.1.0
  url_launcher: ^6.3.0

  # I18n
  intl: ^0.20.0

  # IDs
  uuid: ^4.5.0

  # Speech
  speech_to_text: ^7.4.0

  # Networking
  http: ^1.6.0
  crypto: ^3.0.3

  # Fonts
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner:
  drift_dev:
  riverpod_generator: ^4.0.0
  mockito: ^5.6.0
  coverage: ^1.15.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
