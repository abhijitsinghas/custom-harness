<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Little Library — Export</title>
<style>
  :root {
    --md-sys-color-primary: #5D4037;
    --md-sys-color-on-primary: #FFFFFF;
    --md-sys-color-primary-container: #EADDCF;
    --md-sys-color-on-primary-container: #3E2B23;
    --md-sys-color-secondary: #FFA000;
    --md-sys-color-on-secondary: #FFFFFF;
    --md-sys-color-secondary-container: #FFE0B2;
    --md-sys-color-surface: #FFF8F0;
    --md-sys-color-surface-variant: #F2ECE6;
    --md-sys-color-background: #FAFAF5;
    --md-sys-color-on-surface: #1C1B1F;
    --md-sys-color-on-surface-variant: #49454F;
    --md-sys-color-outline: #79747E;
    --md-sys-color-outline-variant: #CAC4D0;
    --md-sys-color-green: #4CAF50;
    --md-sys-color-blue: #2196F3;
    --md-sys-color-red: #F44336;
    --md-sys-elevation-1: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
    --md-sys-elevation-2: 0 3px 6px rgba(0,0,0,0.15), 0 2px 4px rgba(0,0,0,0.12);
    --font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  [data-theme="dark"] {
    --md-sys-color-primary: #D4C4B5;
    --md-sys-color-on-primary: #3E2B23;
    --md-sys-color-primary-container: #5D4037;
    --md-sys-color-on-primary-container: #EADDCF;
    --md-sys-color-secondary: #FFB945;
    --md-sys-color-on-secondary: #3E2B23;
    --md-sys-color-secondary-container: #6B4A2E;
    --md-sys-color-surface: #2B2930;
    --md-sys-color-surface-variant: #3E3B44;
    --md-sys-color-background: #1C1B1F;
    --md-sys-color-on-surface: #E6E1E5;
    --md-sys-color-on-surface-variant: #CAC4D0;
    --md-sys-color-outline: #938F99;
    --md-sys-color-outline-variant: #49454F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: var(--font-family);
    background: #000;
    color: var(--md-sys-color-on-surface);
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .device-frame {
    width: 412px;
    height: 900px;
    background: var(--md-sys-color-background);
    border-radius: 24px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  @media (max-width: 440px) {
    .device-frame { width: 100vw; height: 100vh; border-radius: 0; }
  }
  .status-bar {
    height: 32px;
    background: var(--md-sys-color-surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-size: 12px;
    font-weight: 500;
    color: var(--md-sys-color-on-surface);
  }
  .app-bar {
    height: 56px;
    background: var(--md-sys-color-surface);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
    box-shadow: var(--md-sys-elevation-1);
    z-index: 10;
  }
  .app-bar__title {
    font-size: 20px;
    font-weight: 500;
    color: var(--md-sys-color-on-surface);
    flex: 1;
  }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 20px;
    border: none;
    background: transparent;
    color: var(--md-sys-color-on-surface-variant);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .content {
    flex: 1;
    overflow-y: auto;
    background: var(--md-sys-color-background);
    padding: 20px 16px;
  }
  .content::-webkit-scrollbar { display: none; }

  .section-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--md-sys-color-on-surface-variant);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }

  .format-chips {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .chip {
    height: 40px;
    padding: 0 16px;
    border-radius: 20px;
    border: 1.5px solid var(--md-sys-color-outline-variant);
    background: var(--md-sys-color-surface);
    color: var(--md-sys-color-on-surface);
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
  }
  .chip:hover { border-color: var(--md-sys-color-outline); }
  .chip.selected {
    border-color: var(--md-sys-color-primary);
    background: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-on-primary-container);
  }
  .chip-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--md-sys-color-outline-variant);
  }
  .chip.selected .chip-dot { background: var(--md-sys-color-primary); }

  .card {
    background: var(--md-sys-color-surface);
    border-radius: 20px;
    padding: 20px;
    box-shadow: var(--md-sys-elevation-1);
    margin-bottom: 16px;
  }
  .card h3 {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .card__subtitle {
    font-size: 14px;
    color: var(--md-sys-color-on-surface-variant);
    margin-bottom: 16px;
  }

  .option-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--md-sys-color-outline-variant);
  }
  .option-row:last-child { border-bottom: none; }
  .option-row input[type="checkbox"] {
    width: 20px; height: 20px;
    accent-color: var(--md-sys-color-primary);
    flex-shrink: 0;
  }
  .option-row__text { flex: 1; }
  .option-row__label { font-size: 15px; font-weight: 500; }
  .option-row__hint {
    font-size: 13px;
    color: var(--md-sys-color-on-surface-variant);
    margin-top: 2px;
  }

  .hint {
    font-size: 13px;
    color: var(--md-sys-color-on-surface-variant);
    margin: 12px 0 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .hint svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

  .preview-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 16px;
    background: var(--md-sys-color-surface-variant);
    margin-bottom: 16px;
  }
  .preview-bar__icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-on-primary-container);
    display: flex; align-items: center; justify-content: center;
  }
  .preview-bar__info { flex: 1; }
  .preview-bar__title { font-size: 15px; font-weight: 500; }
  .preview-bar__meta { font-size: 13px; color: var(--md-sys-color-on-surface-variant); }

  .export-btn {
    width: 100%;
    height: 52px;
    border-radius: 26px;
    border: none;
    background: var(--md-sys-color-primary);
    color: var(--md-sys-color-on-primary);
    font-size: 16px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.2s, transform 0.1s;
  }
  .export-btn:active { transform: scale(0.98); }
  .export-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .success-toast {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--md-sys-color-green);
    color: #fff;
    padding: 12px 20px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 100;
    white-space: nowrap;
  }
  .success-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .gesture-nav {
    height: 20px;
    background: var(--md-sys-color-surface);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 8px;
  }
  .gesture-pill {
    width: 108px;
    height: 4px;
    background: var(--md-sys-color-on-surface);
    opacity: 0.4;
    border-radius: 2px;
  }
</style>
</head>
<body>
<div class="device-frame">
  <div class="status-bar"><span>9:41</span><span>🔋 85%</span></div>
  <div class="app-bar">
    <button class="icon-btn" onclick="goBack()" aria-label="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <span class="app-bar__title">Export Catalog</span>
    <div style="width:40px"></div>
  </div>

  <div class="content">
    <div class="section-title">Format</div>
    <div class="format-chips">
      <button class="chip selected" data-format="csv" onclick="selectFormat(this)">
        <span class="chip-dot"></span>CSV
      </button>
      <button class="chip" data-format="json" onclick="selectFormat(this)">
        <span class="chip-dot"></span>JSON
      </button>
      <button class="chip" data-format="txt" onclick="selectFormat(this)">
        <span class="chip-dot"></span>Text
      </button>
    </div>

    <div class="preview-bar">
      <div class="preview-bar__icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg>
      </div>
      <div class="preview-bar__info">
        <div class="preview-bar__title">little-library-export.csv</div>
        <div class="preview-bar__meta">247 books · 18 KB</div>
      </div>
    </div>

    <div class="card">
      <h3>Options</h3>
      <div class="card__subtitle">What to include in the export</div>

      <label class="option-row">
        <input type="checkbox" checked>
        <div class="option-row__text">
          <div class="option-row__label">All books</div>
          <div class="option-row__hint">Include every book in the catalog</div>
        </div>
      </label>

      <label class="option-row">
        <input type="checkbox">
        <div class="option-row__text">
          <div class="option-row__label">Cover images</div>
          <div class="option-row__hint">Generates larger file; great for backups</div>
        </div>
      </label>

      <label class="option-row">
        <input type="checkbox">
        <div class="option-row__text">
          <div class="option-row__label">Loan history</div>
          <div class="option-row__hint">Include checkout and return records</div>
        </div>
      </label>
    </div>

    <div class="hint">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
      Exports are saved to Downloads and can be shared from there.
    </div>

    <div style="height:8px"></div>
    <button class="export-btn" onclick="doExport()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      Export Catalog
    </button>
  </div>

  <div class="success-toast" id="toast">Exported to Downloads</div>
  <div class="gesture-nav"><div class="gesture-pill"></div></div>
</div>

<script>
  function goBack() { window.location.href = 'settings.html'; }

  let selected = 'csv';
  function selectFormat(btn) {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
    btn.classList.add('selected');
    selected = btn.dataset.format;

    const titles = { csv: 'little-library-export.csv', json: 'little-library-export.json', txt: 'little-library-export.txt' };
    const sizes = { csv: '18 KB', json: '42 KB', txt: '12 KB' };
    document.querySelector('.preview-bar__title').textContent = titles[selected];
    document.querySelector('.preview-bar__meta').textContent = '247 books · ' + sizes[selected];
  }

  function doExport() {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }
</script>
</body>
</html>
