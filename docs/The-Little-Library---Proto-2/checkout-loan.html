<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Little Library — Checkout / Loan</title>
<style>
  :root {
    --md-sys-color-primary: #5D4037;
    --md-sys-color-on-primary: #FFFFFF;
    --md-sys-color-primary-container: #EADDCF;
    --md-sys-color-on-primary-container: #3E2B23;
    --md-sys-color-secondary: #FFA000;
    --md-sys-color-on-secondary: #FFFFFF;
    --md-sys-color-secondary-container: #FFE0B2;
    --md-sys-color-surface: #FFF8F0;
    --md-sys-color-surface-variant: #F2ECE6;
    --md-sys-color-background: #FAFAF5;
    --md-sys-color-on-surface: #1C1B1F;
    --md-sys-color-on-surface-variant: #49454F;
    --md-sys-color-outline: #79747E;
    --md-sys-color-outline-variant: #CAC4D0;
    --md-sys-color-error: #B3261E;
    --md-sys-color-error-container: #F9DEDC;
    --md-sys-color-on-error-container: #410E0B;
    --md-sys-color-green: #4CAF50;
    --md-sys-color-blue: #2196F3;
    --md-sys-color-red: #F44336;
    --md-sys-elevation-1: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
    --md-sys-elevation-2: 0 3px 6px rgba(0,0,0,0.15), 0 2px 4px rgba(0,0,0,0.12);
    --font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  [data-theme="dark"] {
    --md-sys-color-primary: #D4C4B5;
    --md-sys-color-on-primary: #3E2B23;
    --md-sys-color-primary-container: #5D4037;
    --md-sys-color-on-primary-container: #EADDCF;
    --md-sys-color-secondary: #FFB945;
    --md-sys-color-on-secondary: #3E2B23;
    --md-sys-color-secondary-container: #6B4A2E;
    --md-sys-color-surface: #2B2930;
    --md-sys-color-surface-variant: #3E3B44;
    --md-sys-color-background: #1C1B1F;
    --md-sys-color-on-surface: #E6E1E5;
    --md-sys-color-on-surface-variant: #CAC4D0;
    --md-sys-color-outline: #938F99;
    --md-sys-color-outline-variant: #49454F;
    --md-sys-color-error: #F2B8B5;
    --md-sys-color-error-container: #8C1D18;
    --md-sys-color-on-error-container: #F9DEDC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: var(--font-family);
    background: #000;
    color: var(--md-sys-color-on-surface);
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .device-frame {
    width: 412px;
    height: 900px;
    background: var(--md-sys-color-background);
    border-radius: 24px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  @media (max-width: 440px) {
    .device-frame { width: 100vw; height: 100vh; border-radius: 0; }
  }
  .status-bar {
    height: 32px;
    background: var(--md-sys-color-surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-size: 12px;
    font-weight: 500;
    color: var(--md-sys-color-on-surface);
  }
  .app-bar {
    height: 56px;
    background: var(--md-sys-color-surface);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
    box-shadow: var(--md-sys-elevation-1);
    z-index: 10;
  }
  .app-bar__title {
    font-size: 20px;
    font-weight: 500;
    color: var(--md-sys-color-on-surface);
    flex: 1;
  }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 20px;
    border: none;
    background: transparent;
    color: var(--md-sys-color-on-surface-variant);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .content {
    flex: 1;
    overflow-y: auto;
    background: var(--md-sys-color-background);
    padding: 0 0 80px;
  }
  .content::-webkit-scrollbar { display: none; }
  /* Book preview */
  .book-preview {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px;
    background: var(--md-sys-color-surface);
    margin-bottom: 8px;
  }
  .book-preview__cover {
    width: 60px; height: 80px;
    border-radius: 6px;
    background: var(--md-sys-color-surface-variant);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .book-preview__cover svg { width: 32px; height: 32px; fill: var(--md-sys-color-outline); opacity: 0.5; }
  .book-preview__info { flex: 1; }
  .book-preview__title { font-size: 16px; font-weight: 500; }
  .book-preview__author { font-size: 13px; color: var(--md-sys-color-on-surface-variant); margin-top: 2px; }
  /* Section */
  .section {
    background: var(--md-sys-color-surface);
    margin-bottom: 8px;
    padding: 16px;
  }
  .section-title {
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--md-sys-color-primary);
    margin-bottom: 12px;
  }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .field-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--md-sys-color-on-surface-variant);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .field-label .req { color: var(--md-sys-color-error); }
  .field-input, .field-select, .field-textarea {
    width: 100%;
    height: 48px;
    border-radius: 8px;
    border: 1.5px solid var(--md-sys-color-outline);
    background: var(--md-sys-color-surface);
    color: var(--md-sys-color-on-surface);
    padding: 0 14px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
  }
  .field-input:focus, .field-select:focus, .field-textarea:focus { border-color: var(--md-sys-color-primary); }
  .field-textarea { height: auto; min-height: 80px; padding: 12px 14px; resize: vertical; }
  .field-hint {
    font-size: 12px;
    color: var(--md-sys-color-on-surface-variant);
    margin-top: 4px;
  }
  .field-error {
    font-size: 12px;
    color: var(--md-sys-color-error);
    margin-top: 4px;
    display: none;
  }
  .field-error.visible { display: block; }
  /* Radio group */
  .radio-group { display: flex; flex-direction: column; gap: 8px; }
  .radio-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 12px;
    background: var(--md-sys-color-surface-variant);
    cursor: pointer;
    transition: background 0.15s;
  }
  .radio-item:hover { background: var(--md-sys-color-primary-container); }
  .radio-item input[type="radio"] { width: 20px; height: 20px; accent-color: var(--md-sys-color-primary); }
  .radio-item__label { font-size: 14px; font-weight: 500; flex: 1; }
  .radio-item__meta { font-size: 12px; color: var(--md-sys-color-on-surface-variant); }
  /* Bottom bar */
  .bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--md-sys-color-surface);
    padding: 12px 16px 28px;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
    display: flex;
    gap: 12px;
    z-index: 15;
  }
  .bottom-bar button {
    flex: 1;
    height: 48px;
    border-radius: 24px;
    border: none;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  .btn-cancel { background: transparent; color: var(--md-sys-color-primary); }
  .btn-save { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
  /* Dialog */
  .dialog-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 24px;
  }
  .dialog-overlay.open { display: flex; }
  .dialog {
    width: 100%;
    max-width: 320px;
    background: var(--md-sys-color-surface);
    border-radius: 20px;
    padding: 20px;
    box-shadow: var(--md-sys-elevation-2);
  }
  .dialog h4 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
  .dialog p { font-size: 14px; color: var(--md-sys-color-on-surface-variant); line-height: 1.5; margin-bottom: 16px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .dialog-actions button {
    height: 40px;
    padding: 0 16px;
    border-radius: 20px;
    border: none;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  .dialog-actions .btn-text { background: transparent; color: var(--md-sys-color-primary); }
  .dialog-actions .btn-filled { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
  .gesture-nav {
    height: 20px;
    background: var(--md-sys-color-surface);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 8px;
  }
  .gesture-pill {
    width: 108px;
    height: 4px;
    background: var(--md-sys-color-on-surface);
    opacity: 0.4;
    border-radius: 2px;
  }
</style>
</head>
<body>
<div class="device-frame">
  <div class="status-bar"><span>9:41</span><span>🔋 85%</span></div>
  <div class="app-bar">
    <button class="icon-btn" onclick="goBack()" aria-label="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <span class="app-bar__title" id="page-title">Check Out</span>
    <div style="width:40px"></div>
  </div>

  <div class="content">
    <div class="book-preview">
      <div class="book-preview__cover">
        <svg viewBox="0 0 24 24"><path d="M18 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V4a2 2 0 00-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
      </div>
      <div class="book-preview__info">
        <div class="book-preview__title">The Alchemist</div>
        <div class="book-preview__author">Paulo Coelho</div>
      </div>
    </div>

    <!-- Checkout form -->
    <div class="section" id="checkout-form">
      <div class="section-title">Who has this book?</div>
      <div class="field">
        <select class="field-select" id="borrower-select">
          <option>Mom</option>
          <option>Dad</option>
          <option>Arjun</option>
          <option>Priya</option>
          <option>Someone else…</option>
        </select>
      </div>
      <div class="field" id="custom-borrower" style="display:none">
        <div class="field-label">Name <span class="req">*</span></div>
        <input class="field-input" placeholder="Enter name">
      </div>
    </div>

    <!-- Loan form -->
    <div class="section" id="loan-form" style="display:none">
      <div class="section-title">Loan Details</div>
      <div class="field">
        <div class="field-label">Borrower Name <span class="req">*</span></div>
        <input class="field-input" placeholder="Enter borrower name">
      </div>
      <div class="field">
        <div class="field-label">Contact (optional)</div>
        <input class="field-input" placeholder="Phone or email">
      </div>
      <div class="field">
        <div class="field-label">Loaned Date <span class="req">*</span></div>
        <input class="field-input" type="date" value="2024-01-15">
      </div>
      <div class="field">
        <div class="field-label">Due Date (optional)</div>
        <input class="field-input" type="date">
      </div>
      <div class="field">
        <div class="field-label">Notes</div>
        <textarea class="field-textarea" placeholder="Any notes about this loan…"></textarea>
      </div>
    </div>

    <!-- Return dialog content -->
    <div class="section" id="return-form" style="display:none">
      <div class="section-title">Return Book</div>
      <div class="radio-group">
        <label class="radio-item">
          <input type="radio" name="return-opt" checked>
          <span class="radio-item__label">Return to Study / Shelf 2</span>
        </label>
        <label class="radio-item">
          <input type="radio" name="return-opt">
          <span class="radio-item__label">Return to a different shelf</span>
        </label>
        <label class="radio-item">
          <input type="radio" name="return-opt">
          <span class="radio-item__label">Return without location</span>
          <span class="radio-item__meta">Sets location to None</span>
        </label>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="btn-cancel" onclick="goBack()">Cancel</button>
    <button class="btn-save" onclick="submitAction()" id="submit-btn">Check Out</button>
  </div>

  <div class="gesture-nav"><div class="gesture-pill"></div></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const mode = params.get('mode') || 'checkout';

  function goBack() { window.location.href = 'book-detail.html'; }

  if (mode === 'checkout') {
    document.getElementById('page-title').textContent = 'Check Out';
    document.getElementById('checkout-form').style.display = 'block';
    document.getElementById('loan-form').style.display = 'none';
    document.getElementById('return-form').style.display = 'none';
    document.getElementById('submit-btn').textContent = 'Check Out';
  } else if (mode === 'loan') {
    document.getElementById('page-title').textContent = 'Loan Book';
    document.getElementById('checkout-form').style.display = 'none';
    document.getElementById('loan-form').style.display = 'block';
    document.getElementById('return-form').style.display = 'none';
    document.getElementById('submit-btn').textContent = 'Loan Book';
  } else if (mode === 'return') {
    document.getElementById('page-title').textContent = 'Return Book';
    document.getElementById('checkout-form').style.display = 'none';
    document.getElementById('loan-form').style.display = 'none';
    document.getElementById('return-form').style.display = 'block';
    document.getElementById('submit-btn').textContent = 'Return';
  }

  document.getElementById('borrower-select').addEventListener('change', function() {
    document.getElementById('custom-borrower').style.display = this.value === 'Someone else…' ? 'block' : 'none';
  });

  function submitAction() {
    alert(document.getElementById('submit-btn').textContent + ' confirmed!');
    window.location.href = 'book-detail.html';
  }
</script>
</body>
</html>
