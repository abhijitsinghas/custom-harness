<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Little Library — Deleted Books</title>
<style>
  :root {
    --md-sys-color-primary: #5D4037;
    --md-sys-color-on-primary: #FFFFFF;
    --md-sys-color-primary-container: #EADDCF;
    --md-sys-color-on-primary-container: #3E2B23;
    --md-sys-color-secondary: #FFA000;
    --md-sys-color-on-secondary: #FFFFFF;
    --md-sys-color-secondary-container: #FFE0B2;
    --md-sys-color-surface: #FFF8F0;
    --md-sys-color-surface-variant: #F2ECE6;
    --md-sys-color-background: #FAFAF5;
    --md-sys-color-on-surface: #1C1B1F;
    --md-sys-color-on-surface-variant: #49454F;
    --md-sys-color-outline: #79747E;
    --md-sys-color-outline-variant: #CAC4D0;
    --md-sys-color-green: #4CAF50;
    --md-sys-color-blue: #2196F3;
    --md-sys-color-red: #F44336;
    --md-sys-elevation-1: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
    --font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  [data-theme="dark"] {
    --md-sys-color-primary: #D4C4B5;
    --md-sys-color-on-primary: #3E2B23;
    --md-sys-color-primary-container: #5D4037;
    --md-sys-color-on-primary-container: #EADDCF;
    --md-sys-color-secondary: #FFB945;
    --md-sys-color-on-secondary: #3E2B23;
    --md-sys-color-secondary-container: #6B4A2E;
    --md-sys-color-surface: #2B2930;
    --md-sys-color-surface-variant: #3E3B44;
    --md-sys-color-background: #1C1B1F;
    --md-sys-color-on-surface: #E6E1E5;
    --md-sys-color-on-surface-variant: #CAC4D0;
    --md-sys-color-outline: #938F99;
    --md-sys-color-outline-variant: #49454F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: var(--font-family);
    background: #000;
    color: var(--md-sys-color-on-surface);
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .device-frame {
    width: 412px;
    height: 900px;
    background: var(--md-sys-color-background);
    border-radius: 24px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  @media (max-width: 440px) {
    .device-frame { width: 100vw; height: 100vh; border-radius: 0; }
  }
  .status-bar {
    height: 32px;
    background: var(--md-sys-color-surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-size: 12px;
    font-weight: 500;
    color: var(--md-sys-color-on-surface);
  }
  .app-bar {
    height: 56px;
    background: var(--md-sys-color-surface);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
    box-shadow: var(--md-sys-elevation-1);
    z-index: 10;
  }
  .app-bar__title {
    font-size: 20px;
    font-weight: 500;
    color: var(--md-sys-color-on-surface);
    flex: 1;
  }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 20px;
    border: none;
    background: transparent;
    color: var(--md-sys-color-on-surface-variant);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 24px;
    background: var(--md-sys-color-background);
  }
  .content::-webkit-scrollbar { display: none; }
  .book-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding-top: 12px;
  }
  .book-card {
    background: var(--md-sys-color-surface);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--md-sys-elevation-1);
    cursor: pointer;
    position: relative;
    opacity: 0.7;
  }
  .book-card .cover {
    aspect-ratio: 3/4;
    background: var(--md-sys-color-surface-variant);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .book-card .cover img {
    width: 100%; height: 100%; object-fit: cover;
    filter: grayscale(0.6);
  }
  .book-card .cover-placeholder {
    width: 48px; height: 48px;
    opacity: 0.35;
  }
  .book-card .info {
    padding: 10px 12px 12px;
  }
  .book-card .title {
    font-size: 14px;
    font-weight: 500;
    color: var(--md-sys-color-on-surface);
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-decoration: line-through;
  }
  .book-card .author {
    font-size: 12px;
    color: var(--md-sys-color-on-surface-variant);
    margin-top: 2px;
  }
  .book-card .deleted-badge {
    position: absolute;
    top: 8px; left: 8px;
    background: var(--md-sys-color-red);
    color: #fff;
    font-size: 10px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 8px;
  }
  /* Empty state */
  .empty-state {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    text-align: center;
  }
  .empty-state.visible { display: flex; }
  .empty-state__icon {
    width: 80px; height: 80px;
    background: var(--md-sys-color-surface-variant);
    border-radius: 40px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
  }
  .empty-state__icon svg { width: 40px; height: 40px; fill: var(--md-sys-color-outline); }
  .empty-state__title { font-size: 16px; font-weight: 500; }
  .empty-state__body { font-size: 14px; color: var(--md-sys-color-on-surface-variant); margin-top: 6px; }
  .gesture-nav {
    height: 20px;
    background: var(--md-sys-color-surface);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 8px;
  }
  .gesture-pill {
    width: 108px;
    height: 4px;
    background: var(--md-sys-color-on-surface);
    opacity: 0.4;
    border-radius: 2px;
  }
</style>
</head>
<body>
<div class="device-frame">
  <div class="status-bar"><span>9:41</span><span>🔋 85%</span></div>
  <div class="app-bar">
    <button class="icon-btn" onclick="goBack()" aria-label="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <span class="app-bar__title">Deleted Books</span>
    <div style="width:40px"></div>
  </div>

  <div class="content">
    <div class="book-grid">
      <div class="book-card" onclick="restoreBook()">
        <div class="cover">
          <span class="deleted-badge">Deleted</span>
          <div class="cover-placeholder">
            <svg viewBox="0 0 24 24" fill="var(--md-sys-color-outline)" width="48" height="48"><path d="M18 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V4a2 2 0 00-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
          </div>
        </div>
        <div class="info">
          <div class="title">Old Yeller</div>
          <div class="author">Fred Gipson</div>
        </div>
      </div>
      <div class="book-card" onclick="restoreBook()">
        <div class="cover">
          <span class="deleted-badge">Deleted</span>
          <div class="cover-placeholder">
            <svg viewBox="0 0 24 24" fill="var(--md-sys-color-outline)" width="48" height="48"><path d="M18 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V4a2 2 0 00-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
          </div>
        </div>
        <div class="info">
          <div class="title">The Catcher in the Rye</div>
          <div class="author">J.D. Salinger</div>
        </div>
      </div>
    </div>

    <div class="empty-state" id="empty-state">
      <div class="empty-state__icon">
        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      </div>
      <div class="empty-state__title">No deleted books</div>
      <div class="empty-state__body">Books you delete will appear here for recovery.</div>
    </div>
  </div>

  <div class="gesture-nav"><div class="gesture-pill"></div></div>
</div>

<script>
  function goBack() { window.location.href = 'catalog.html'; }
  function restoreBook() { alert('Book restored!'); }
</script>
</body>
</html>
