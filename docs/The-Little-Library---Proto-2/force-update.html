<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Little Library — Update Required</title>
<style>
  :root {
    --md-sys-color-primary: #5D4037;
    --md-sys-color-on-primary: #FFFFFF;
    --md-sys-color-primary-container: #EADDCF;
    --md-sys-color-on-primary-container: #3E2B23;
    --md-sys-color-secondary: #FFA000;
    --md-sys-color-on-secondary: #FFFFFF;
    --md-sys-color-secondary-container: #FFE0B2;
    --md-sys-color-surface: #FFF8F0;
    --md-sys-color-surface-variant: #F2ECE6;
    --md-sys-color-background: #FAFAF5;
    --md-sys-color-on-surface: #1C1B1F;
    --md-sys-color-on-surface-variant: #49454F;
    --md-sys-color-outline: #79747E;
    --md-sys-color-outline-variant: #CAC4D0;
    --md-sys-color-green: #4CAF50;
    --md-sys-color-blue: #2196F3;
    --md-sys-color-red: #F44336;
    --md-sys-elevation-1: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
    --md-sys-elevation-2: 0 3px 6px rgba(0,0,0,0.15), 0 2px 4px rgba(0,0,0,0.12);
    --font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  [data-theme="dark"] {
    --md-sys-color-primary: #D4C4B5;
    --md-sys-color-on-primary: #3E2B23;
    --md-sys-color-primary-container: #5D4037;
    --md-sys-color-on-primary-container: #EADDCF;
    --md-sys-color-secondary: #FFB945;
    --md-sys-color-on-secondary: #3E2B23;
    --md-sys-color-secondary-container: #6B4A2E;
    --md-sys-color-surface: #2B2930;
    --md-sys-color-surface-variant: #3E3B44;
    --md-sys-color-background: #1C1B1F;
    --md-sys-color-on-surface: #E6E1E5;
    --md-sys-color-on-surface-variant: #CAC4D0;
    --md-sys-color-outline: #938F99;
    --md-sys-color-outline-variant: #49454F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: var(--font-family);
    background: #000;
    color: var(--md-sys-color-on-surface);
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .device-frame {
    width: 412px;
    height: 900px;
    background: var(--md-sys-color-background);
    border-radius: 24px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  @media (max-width: 440px) {
    .device-frame { width: 100vw; height: 100vh; border-radius: 0; }
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 32px;
    background: var(--md-sys-color-background);
    text-align: center;
  }
  .logo {
    width: 96px; height: 96px;
    background: var(--md-sys-color-primary-container);
    border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 32px;
  }
  .logo svg { width: 56px; height: 56px; fill: var(--md-sys-color-primary); }
  .heading {
    font-size: 24px;
    font-weight: 500;
    color: var(--md-sys-color-on-surface);
    margin-bottom: 12px;
  }
  .message {
    font-size: 15px;
    color: var(--md-sys-color-on-surface-variant);
    line-height: 1.6;
    margin-bottom: 8px;
  }
  .sub-message {
    font-size: 13px;
    color: var(--md-sys-color-on-surface-variant);
    opacity: 0.8;
    margin-bottom: 32px;
  }
  .btn {
    width: 100%;
    max-width: 280px;
    height: 52px;
    border-radius: 26px;
    border: none;
    font-size: 16px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-primary {
    background: var(--md-sys-color-primary);
    color: var(--md-sys-color-on-primary);
    box-shadow: var(--md-sys-elevation-2);
  }
  .gesture-nav {
    height: 20px;
    background: var(--md-sys-color-surface);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 8px;
  }
  .gesture-pill {
    width: 108px;
    height: 4px;
    background: var(--md-sys-color-on-surface);
    opacity: 0.4;
    border-radius: 2px;
  }
</style>
</head>
<body>
<div class="device-frame">
  <div class="content">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M18 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V4a2 2 0 00-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
    </div>
    <h1 class="heading">Update Required</h1>
    <p class="message">This library has been updated by another device. Please update The Little Library to continue.</p>
    <p class="sub-message">Your data is safe and will sync after the update.</p>
    <button class="btn btn-primary" onclick="updateApp()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      Update on Play Store
    </button>
  </div>
  <div class="gesture-nav"><div class="gesture-pill"></div></div>
</div>

<script>
  function updateApp() { alert('Opening Google Play Store…'); }
</script>
</body>
</html>
