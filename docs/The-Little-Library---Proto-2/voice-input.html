<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Little Library — Voice Input</title>
<style>
  :root {
    --md-sys-color-primary: #5D4037;
    --md-sys-color-on-primary: #FFFFFF;
    --md-sys-color-primary-container: #EADDCF;
    --md-sys-color-on-primary-container: #3E2B23;
    --md-sys-color-secondary: #FFA000;
    --md-sys-color-on-secondary: #FFFFFF;
    --md-sys-color-secondary-container: #FFE0B2;
    --md-sys-color-surface: #FFF8F0;
    --md-sys-color-surface-variant: #F2ECE6;
    --md-sys-color-background: #FAFAF5;
    --md-sys-color-on-surface: #1C1B1F;
    --md-sys-color-on-surface-variant: #49454F;
    --md-sys-color-outline: #79747E;
    --md-sys-color-outline-variant: #CAC4D0;
    --md-sys-color-green: #4CAF50;
    --md-sys-color-blue: #2196F3;
    --md-sys-color-red: #F44336;
    --md-sys-elevation-1: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
    --md-sys-elevation-2: 0 3px 6px rgba(0,0,0,0.15), 0 2px 4px rgba(0,0,0,0.12);
    --font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  [data-theme="dark"] {
    --md-sys-color-primary: #D4C4B5;
    --md-sys-color-on-primary: #3E2B23;
    --md-sys-color-primary-container: #5D4037;
    --md-sys-color-on-primary-container: #EADDCF;
    --md-sys-color-secondary: #FFB945;
    --md-sys-color-on-secondary: #3E2B23;
    --md-sys-color-secondary-container: #6B4A2E;
    --md-sys-color-surface: #2B2930;
    --md-sys-color-surface-variant: #3E3B44;
    --md-sys-color-background: #1C1B1F;
    --md-sys-color-on-surface: #E6E1E5;
    --md-sys-color-on-surface-variant: #CAC4D0;
    --md-sys-color-outline: #938F99;
    --md-sys-color-outline-variant: #49454F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: var(--font-family);
    background: #000;
    color: var(--md-sys-color-on-surface);
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .device-frame {
    width: 412px;
    height: 900px;
    background: var(--md-sys-color-background);
    border-radius: 24px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  @media (max-width: 440px) {
    .device-frame { width: 100vw; height: 100vh; border-radius: 0; }
  }
  .status-bar {
    height: 32px;
    background: var(--md-sys-color-surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-size: 12px;
    font-weight: 500;
    color: var(--md-sys-color-on-surface);
  }
  .app-bar {
    height: 56px;
    background: var(--md-sys-color-surface);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
    box-shadow: var(--md-sys-elevation-1);
    z-index: 10;
  }
  .app-bar__title {
    font-size: 20px;
    font-weight: 500;
    color: var(--md-sys-color-on-surface);
    flex: 1;
  }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 20px;
    border: none;
    background: transparent;
    color: var(--md-sys-color-on-surface-variant);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--md-sys-color-background);
    position: relative;
  }
  /* Waveform */
  .waveform-wrap {
    width: 200px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin-bottom: 24px;
  }
  .wave-bar {
    width: 6px;
    background: var(--md-sys-color-primary);
    border-radius: 3px;
    animation: wave 1.2s ease-in-out infinite;
  }
  .wave-bar:nth-child(1) { height: 20px; animation-delay: 0s; }
  .wave-bar:nth-child(2) { height: 40px; animation-delay: 0.1s; }
  .wave-bar:nth-child(3) { height: 70px; animation-delay: 0.2s; }
  .wave-bar:nth-child(4) { height: 50px; animation-delay: 0.3s; }
  .wave-bar:nth-child(5) { height: 90px; animation-delay: 0.15s; }
  .wave-bar:nth-child(6) { height: 60px; animation-delay: 0.25s; }
  .wave-bar:nth-child(7) { height: 80px; animation-delay: 0.05s; }
  .wave-bar:nth-child(8) { height: 35px; animation-delay: 0.35s; }
  .wave-bar:nth-child(9) { height: 55px; animation-delay: 0.12s; }
  .wave-bar:nth-child(10) { height: 25px; animation-delay: 0.22s; }
  @keyframes wave {
    0%, 100% { transform: scaleY(0.5); opacity: 0.6; }
    50% { transform: scaleY(1); opacity: 1; }
  }
  .waveform-wrap.processing .wave-bar {
    animation: wave 0.6s ease-in-out infinite;
    background: var(--md-sys-color-secondary);
  }
  /* Mic button */
  .mic-btn {
    width: 96px; height: 96px;
    border-radius: 48px;
    border: none;
    background: var(--md-sys-color-primary);
    color: var(--md-sys-color-on-primary);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: var(--md-sys-elevation-2);
    transition: transform 0.2s, box-shadow 0.2s;
    margin-bottom: 24px;
  }
  .mic-btn:active { transform: scale(0.95); }
  .mic-btn svg { width: 40px; height: 40px; fill: currentColor; }
  .mic-btn.listening {
    animation: pulse-mic 1.5s ease-in-out infinite;
  }
  @keyframes pulse-mic {
    0%, 100% { box-shadow: 0 0 0 0 rgba(93,64,55,0.4); }
    50% { box-shadow: 0 0 0 20px rgba(93,64,55,0); }
  }
  /* Status text */
  .status-text {
    font-size: 18px;
    font-weight: 500;
    color: var(--md-sys-color-on-surface);
    margin-bottom: 8px;
  }
  .sub-status {
    font-size: 14px;
    color: var(--md-sys-color-on-surface-variant);
    margin-bottom: 24px;
  }
  /* Transcription */
  .transcription {
    width: 100%;
    max-height: 200px;
    overflow-y: auto;
    background: var(--md-sys-color-surface);
    border-radius: 16px;
    padding: 16px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--md-sys-color-on-surface);
    margin-bottom: 24px;
    display: none;
  }
  .transcription.visible { display: block; }
  .transcription .live-word { color: var(--md-sys-color-primary); font-weight: 500; }
  /* Tier indicator */
  .tier-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 16px;
    background: var(--md-sys-color-surface-variant);
    color: var(--md-sys-color-on-surface-variant);
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 24px;
  }
  .tier-badge .dot {
    width: 8px; height: 8px;
    border-radius: 4px;
    background: var(--md-sys-color-green);
  }
  /* Bottom actions */
  .bottom-actions {
    display: flex;
    gap: 12px;
    width: 100%;
  }
  .bottom-actions button {
    flex: 1;
    height: 48px;
    border-radius: 24px;
    border: none;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  .btn-cancel { background: transparent; color: var(--md-sys-color-primary); }
  .btn-save { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
  .gesture-nav {
    height: 20px;
    background: var(--md-sys-color-surface);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 8px;
  }
  .gesture-pill {
    width: 108px;
    height: 4px;
    background: var(--md-sys-color-on-surface);
    opacity: 0.4;
    border-radius: 2px;
  }
</style>
</head>
<body>
<div class="device-frame">
  <div class="status-bar"><span>9:41</span><span>🔋 85%</span></div>
  <div class="app-bar">
    <button class="icon-btn" onclick="goBack()" aria-label="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <span class="app-bar__title">Voice Input</span>
    <div style="width:40px"></div>
  </div>

  <div class="content">
    <div class="waveform-wrap" id="waveform">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>

    <button class="mic-btn" id="mic-btn" onclick="toggleListening()">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>

    <div class="status-text" id="status-text">Tap to speak</div>
    <div class="sub-status" id="sub-status">Hold the book details in mind</div>

    <div class="tier-badge" id="tier-badge" style="display:none">
      <span class="dot"></span>
      <span id="tier-text">Using on-device AI</span>
    </div>

    <div class="transcription" id="transcription">
      <span class="live-word">The Alchemist</span> by Paulo Coelho. It's a paperback, published by HarperOne in 2014. I bought it for twelve dollars. It's on the study shelf two.
    </div>

    <div class="bottom-actions" id="bottom-actions" style="display:none">
      <button class="btn-cancel" onclick="goBack()">Cancel</button>
      <button class="btn-save" onclick="goToForm()">Continue</button>
    </div>
  </div>

  <div class="gesture-nav"><div class="gesture-pill"></div></div>
</div>

<script>
  let isListening = false;
  let isProcessing = false;

  function goBack() { window.location.href = 'catalog.html'; }
  function goToForm() { window.location.href = 'add-book.html?voice=true'; }

  function toggleListening() {
    if (isProcessing) return;
    if (!isListening) {
      isListening = true;
      document.getElementById('mic-btn').classList.add('listening');
      document.getElementById('status-text').textContent = 'Listening…';
      document.getElementById('sub-status').textContent = 'Speak now — describe the book';
      // Simulate transcription after a delay
      setTimeout(() => {
        document.getElementById('sub-status').textContent = 'Keep speaking or tap Done';
      }, 1500);
    } else {
      stopListening();
    }
  }

  function stopListening() {
    isListening = false;
    isProcessing = true;
    document.getElementById('mic-btn').classList.remove('listening');
    document.getElementById('waveform').classList.add('processing');
    document.getElementById('status-text').textContent = 'Processing…';
    document.getElementById('sub-status').textContent = 'Extracting book details';
    document.getElementById('tier-badge').style.display = 'inline-flex';
    document.getElementById('mic-btn').style.display = 'none';

    setTimeout(() => {
      document.getElementById('tier-text').textContent = 'Using cloud AI';
    }, 1200);

    setTimeout(() => {
      document.getElementById('waveform').style.display = 'none';
      document.getElementById('status-text').textContent = 'Done!';
      document.getElementById('sub-status').textContent = 'Review the extracted details';
      document.getElementById('tier-badge').style.display = 'none';
      document.getElementById('transcription').classList.add('visible');
      document.getElementById('bottom-actions').style.display = 'flex';
      isProcessing = false;
    }, 2800);
  }
</script>
</body>
</html>
